name: Automated Code Quality & Security Fixes

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  lint-and-fix:
    name: Lint and Auto-Fix Code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
        node-version: ['18.x']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Python linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black==23.12.0 flake8==6.1.0 isort==5.13.2 pylint==3.0.3

      - name: Install Node.js linting tools
        run: |
          npm install -g eslint@8.55.0 prettier@3.1.0
          npm install --save-dev eslint-config-airbnb-base eslint-plugin-import

      - name: Run Black (Python formatter)
        id: black
        continue-on-error: true
        run: |
          black --line-length 100 --check . --exclude venv 2>&1 | tee black-output.txt || true
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Auto-fix with Black
        if: steps.black.outputs.exit_code != '0'
        run: |
          black --line-length 100 . --exclude venv
          echo "BLACK_FIXED=true" >> $GITHUB_ENV

      - name: Run isort (Python import sorting)
        id: isort
        continue-on-error: true
        run: |
          isort --check-only . --skip venv 2>&1 | tee isort-output.txt || true
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Auto-fix with isort
        if: steps.isort.outputs.exit_code != '0'
        run: |
          isort . --skip venv
          echo "ISORT_FIXED=true" >> $GITHUB_ENV

      - name: Check Python syntax with flake8
        id: flake8
        continue-on-error: true
        run: |
          flake8 . --count --statistics --exit-zero --max-line-length=100 --exclude=venv > flake8-report.txt 2>&1 || true
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Check ESLint configuration exists
        id: eslint-check
        continue-on-error: true
        run: |
          if [ -f ".eslintrc.json" ] || [ -f ".eslintrc.js" ] || [ -f ".eslintrc.yml" ] || grep -q "eslintConfig" package.json 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create default ESLint config (if missing)
        if: steps.eslint-check.outputs.exists == 'false'
        run: |
          cat > .eslintrc.json << 'EOF'
          {
            "env": {
              "node": true,
              "es2021": true,
              "browser": true
            },
            "extends": [
              "airbnb-base"
            ],
            "parserOptions": {
              "ecmaVersion": 2021,
              "sourceType": "module"
            },
            "rules": {
              "no-console": "warn",
              "no-unused-vars": "warn"
            },
            "ignorePatterns": [
              "node_modules/",
              "dist/",
              "build/",
              ".git/"
            ]
          }
          EOF

      - name: Run Prettier (JavaScript formatter)
        id: prettier
        continue-on-error: true
        run: |
          prettier --check "**/*.{js,jsx,ts,tsx,json,css,scss,md}" --ignore-unknown 2>&1 | tee prettier-output.txt || true
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Auto-fix with Prettier
        if: steps.prettier.outputs.exit_code != '0'
        run: |
          prettier --write "**/*.{js,jsx,ts,tsx,json,css,scss,md}" --ignore-unknown
          echo "PRETTIER_FIXED=true" >> $GITHUB_ENV

      - name: Run ESLint
        id: eslint
        continue-on-error: true
        run: |
          eslint . --ext .js,.jsx,.ts,.tsx --format json > eslint-report.json 2>&1 || true
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Auto-fix with ESLint
        if: steps.eslint.outputs.exit_code != '0'
        continue-on-error: true
        run: |
          eslint . --ext .js,.jsx,.ts,.tsx --fix
          echo "ESLINT_FIXED=true" >> $GITHUB_ENV

      - name: Commit auto-fixes
        if: env.BLACK_FIXED == 'true' || env.ISORT_FIXED == 'true' || env.PRETTIER_FIXED == 'true' || env.ESLINT_FIXED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-fix code formatting and imports

- Apply Black formatting (Python)
- Sort imports with isort
- Format code with Prettier
- Auto-fix ESLint violations

[skip ci]"
            git push origin ${{ github.ref }}
          fi

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request' && (env.BLACK_FIXED == 'true' || env.ISORT_FIXED == 'true' || env.PRETTIER_FIXED == 'true' || env.ESLINT_FIXED == 'true')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✨ Automated code formatting applied:\n- Black (Python)\n- isort (Python imports)\n- Prettier (JavaScript/JSON)\n- ESLint (JavaScript)\n\nChanges have been committed. Please review.'
            })

  security-sast:
    name: Static Application Security Testing (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: 'python,javascript'
          tools: latest

      - name: Set up Python for CodeQL
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js for CodeQL
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:python,javascript"

      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: results.sarif

  dependency-check:
    name: Dependency Vulnerability Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Check for Python requirements.txt
        id: py-check
        run: |
          if find . -name "requirements*.txt" -o -name "pyproject.toml" -o -name "setup.py" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Scan Python dependencies with pip-audit
        if: steps.py-check.outputs.exists == 'true'
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --desc --format json > python-audit.json 2>&1 || true
          pip-audit --desc || true

      - name: Scan Node.js dependencies with npm audit
        if: hashFiles('package.json') != ''
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json 2>&1 || true
          npm audit || true

      - name: Report vulnerabilities
        if: always()
        run: |
          echo "## Dependency Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f python-audit.json ]; then
            echo "### Python Dependencies" >> $GITHUB_STEP_SUMMARY
            cat python-audit.json | jq '.' >> $GITHUB_STEP_SUMMARY || echo "See python-audit.json for details" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f npm-audit.json ]; then
            echo "### JavaScript Dependencies" >> $GITHUB_STEP_SUMMARY
            cat npm-audit.json | jq '.metadata' >> $GITHUB_STEP_SUMMARY || echo "See npm-audit.json for details" >> $GITHUB_STEP_SUMMARY
          fi

  quality-gates:
    name: Quality Gates & Reporting
    runs-on: ubuntu-latest
    needs: [lint-and-fix, security-sast, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Quality Report
        run: |
          echo "# Code Quality & Security Report" > quality-report.md
          echo "Generated: $(date -u)" >> quality-report.md
          echo "" >> quality-report.md
          echo "## Status" >> quality-report.md
          echo "- Linting & Formatting: ${{ needs.lint-and-fix.result }}" >> quality-report.md
          echo "- SAST (CodeQL): ${{ needs.security-sast.result }}" >> quality-report.md
          echo "- Dependency Check: ${{ needs.dependency-check.result }}" >> quality-report.md

      - name: Upload Report
        uses: actions/upload-artifact@v3
        with:
          name: quality-report
          path: quality-report.md
          retention-days: 30

      - name: Fail if critical issues
        run: |
          if [ "${{ needs.security-sast.result }}" = "failure" ]; then
            echo "⚠️ Critical security issues detected in CodeQL"
            exit 1
          fi
